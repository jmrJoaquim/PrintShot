<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Capturar página inteira</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 22px; color: #ececef; background: #17181c; font: 15px 'Segoe UI', sans-serif; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 14px; color: #b7b8c0; line-height: 1.45; }
    #status { color: #ff895f; font-weight: 600; margin-right: auto; }
    footer { display: flex; align-items: center; gap: 10px; }
    button { border: 1px solid #42434a; border-radius: 7px; padding: 10px 15px; color: #eee; background: #25262b; font: inherit; cursor: pointer; }
    button.primary { color: #17100d; background: #ff784b; border-color: #ff784b; font-weight: 600; }
    button:disabled { opacity: .55; cursor: wait; }
  </style>
</head>
<body>
  <h1>Captura automática da página</h1>
  <p>Entre na página na janela do navegador. Quando ela estiver pronta, clique para percorrer e capturar os trechos automaticamente até o final.</p>
  <footer><span id="status">Aguardando a página…</span><button class="primary" id="start" disabled>Capturar página inteira</button><button id="cancel">Cancelar</button></footer>
  <script>
    const status = document.getElementById('status');
    const start = document.getElementById('start');
    window.printshot.webCaptureController.onInit(({ title }) => {
      status.textContent = title ? `Pronto: ${title}` : 'Página carregada e pronta';
      start.disabled = false;
    });
    window.printshot.webCaptureController.onProgress(({ count, done }) => {
      status.textContent = done ? `Concluído: ${count} trechos. Abrindo prévia…` : `Capturando trecho ${count}…`;
      if (done) start.disabled = true;
    });
    window.printshot.webCaptureController.onError((msg) => {
      status.textContent = msg;
      start.disabled = false;
    });
    start.onclick = () => { start.disabled = true; status.textContent = 'Percorrendo a página…'; window.printshot.webCaptureController.start(); };
    document.getElementById('cancel').onclick = () => window.printshot.webCaptureController.cancel();
  </script>
</body>
</html>
